<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="sf-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>
    <linearGradient id="sf-spark" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>
  </defs>
  <!-- Base Chassis -->
  <rect width="32" height="32" rx="8" fill="#0B0C0E"/>
  <rect width="30" height="30" x="1" y="1" rx="7" fill="none" stroke="#22272e" stroke-width="1"/>
  
  <!-- Swarm Network Nodes & Forge Energy Lines -->
  <!-- Top Left Node -->
  <circle cx="9" cy="11" r="2.2" fill="#38bdf8" />
  <!-- Top Right Node -->
  <circle cx="23" cy="11" r="2.2" fill="#818cf8" />
  <!-- Bottom Node (Anvil/Forge Center) -->
  <circle cx="16" cy="24" r="2.5" fill="url(#sf-spark)" />

  <!-- Connecting Swarm Flux Paths -->
  <path d="M10.8 12.5 L14.5 21.8" stroke="url(#sf-grad)" stroke-width="2" stroke-linecap="round" opacity="0.85"/>
  <path d="M21.2 12.5 L17.5 21.8" stroke="url(#sf-grad)" stroke-width="2" stroke-linecap="round" opacity="0.85"/>
  <path d="M11.5 11 L20.5 11" stroke="#818cf8" stroke-width="1.8" stroke-linecap="round" opacity="0.7"/>

  <!-- Core Forge Core Spark -->
  <path d="M16 6 L17.2 9 L20 10.2 L17.2 11.4 L16 14.5 L14.8 11.4 L12 10.2 L14.8 9 Z" fill="url(#sf-spark)" />
</svg>
